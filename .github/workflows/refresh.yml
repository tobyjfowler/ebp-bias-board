name: Refresh EBP bias board

on:
  # Scheduled runs retired: the board's higher-timeframe biases now come from TradingView via the relay.
  # Keep manual runs as an audit tool (compares Databento-built candles with the chart).
  workflow_dispatch:
    inputs:
      force_summary:
        description: "Send the Telegram summary even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build data.json
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: |
          set -o pipefail
          git show HEAD:docs/data.json > /tmp/previous.json 2>/dev/null || true
          python ebp_engine.py --source databento --history-dir docs/history --out docs/data.json --raw-dir docs/raw 2>&1 | tee docs/last_run.log
      - name: Commit if changed
        if: always()
        run: |
          git config user.name "ebp-bot"
          git config user.email "ebp-bot@users.noreply.github.com"
          git add docs/data.json docs/raw docs/history docs/last_run.log
          git diff --cached --quiet && echo "no change" || git commit -m "refresh $(date -u +%F)" && git push

  # Commits made with the workflow token do not trigger other workflows, so publish here.
  publish:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
